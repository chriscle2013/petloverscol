name: Validate secure checkout

on:
  push:
    branches:
      - fix/secure-checkout-functions
  pull_request:
    branches:
      - main

jobs:
  validate-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/productos-data.js
          node --check functions/tarifas-envio.js
          node --check functions/smoke-test.js
          node functions/smoke-test.js
          for file in js/product.js js/admin.js js/firebase.js js/tarifas-envio.js productos-data.js js/colombia-data.js; do
            node --input-type=module --check < "$file"
          done
          python - <<'PY'
          from pathlib import Path
          html = Path("checkout.html").read_text(encoding="utf-8")
          marker = '<script type="module">'
          start = html.index(marker) + len(marker)
          end = html.index("</script>", start)
          Path("/tmp/checkout-inline.mjs").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/checkout-inline.mjs
