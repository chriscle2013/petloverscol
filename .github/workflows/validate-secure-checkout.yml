name: Validate secure checkout

on:
  push:
    branches:
      - fix/secure-checkout-functions
  pull_request:
    branches:
      - main

jobs:
  validate-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/productos-data.js
          node --check functions/tarifas-envio.js
